# Build staging Postgres (PostGIS + pgvector). Push to GHCR on main/stage only — never from PRs.
# Compose pulls this image via POSTGRES_IMAGE in .env.

name: Build Postgres image

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - stage
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/postgres
  POSTGRES_IMAGE_TAG: "16-3.5-pgvector"

jobs:
  build:
    name: Build Postgres (16-3.5-pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs only prove the image builds. Publishing happens on push to main/stage (and manual runs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./postgres
          file: ./postgres/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.POSTGRES_IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Print image reference
        if: github.event_name != 'pull_request'
        run: |
          echo "POSTGRES_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.POSTGRES_IMAGE_TAG }}"
