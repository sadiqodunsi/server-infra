name: CI

on:
  pull_request:
    branches:
      - main
      - stage
  push:
    branches:
      - main
      - stage

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
