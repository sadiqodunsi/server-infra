# =============================================================================
# Staging Entrypoint - Self-Managed Postgres
# =============================================================================
# Production uses managed Postgres and does not use this file.
# docker compose -f docker-compose.staging.yml up -d
# Overrides live in docker-compose.staging.overrides.yml (required by Compose
# include semantics — patches cannot sit in the same file as `include`).
# =============================================================================

include:
  - docker-compose.yml
  - docker-compose.staging.overrides.yml
